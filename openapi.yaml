components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BoqId:
      name: boqId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    EntityId:
      name: entityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    MilestoneId:
      name: milestoneId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PackageId:
      name: packageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    BoqLineItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        quantity:
          type: string
        total:
          $ref: "#/components/schemas/Money"
        unit:
          type: string
        unitRate:
          $ref: "#/components/schemas/Money"
    CollectionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    CreateProjectRequest:
      type: object
      required: [entityId, clientUserId, startDate, targetHandoverDate, name]
      properties:
        clientUserId:
          type: string
          format: uuid
        entityId:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/LocalizedText"
        startDate:
          type: string
          format: date
        targetHandoverDate:
          type: string
          format: date
    DocumentVersion:
      type: object
      properties:
        clientShared:
          type: boolean
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, for_review, approved, superseded]
        versionNo:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - BUSINESS_RULE_VIOLATION
                - RATE_LIMITED
                - INTERNAL_ERROR
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
            message:
              type: string
            requestId:
              type: string
    EsignCallback:
      type: object
      required: [envelopeId, status, signedDocumentUrl, signedAt]
      properties:
        envelopeId:
          type: string
        signedAt:
          type: string
          format: date-time
        signedDocumentUrl:
          type: string
          format: uri
        status:
          type: string
    LocalizedText:
      type: object
      additionalProperties:
        type: string
      example:
        en: Marina Tower Fit-Out
        ar: تجهيز برج المارينا
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal string, never a float
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    Project:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        entityId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/LocalizedText"
        startDate:
          type: string
          format: date
        status:
          type: string
          enum: [proposed, active, on_hold, handover_in_progress, closed, cancelled]
        targetHandoverDate:
          type: string
          format: date
        updatedAt:
          type: string
          format: date-time
    ResponseMeta:
      type: object
      properties:
        locale:
          type: string
        pagination:
          type: object
          properties:
            hasMore:
              type: boolean
            limit:
              type: integer
            nextCursor:
              type: string
              nullable: true
        requestId:
          type: string
    SignedUrl:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [downloadUrl, expiresAt]
          properties:
            downloadUrl:
              type: string
              format: uri
            expiresAt:
              type: string
              format: date-time
    SignedUpload:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [uploadUrl, versionId, expiresAt]
          properties:
            expiresAt:
              type: string
              format: date-time
            uploadUrl:
              type: string
              format: uri
            versionId:
              type: string
              format: uuid
    SingleResourceEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
        meta:
          $ref: "#/components/schemas/ResponseMeta"
  responses:
    Accepted:
      description: Accepted for asynchronous processing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SingleResourceEnvelope"
    BoqLineItemCollection:
      description: Paginated BOQ line item collection.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/CollectionEnvelope"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BoqLineItem"
    BusinessRuleViolation:
      description: Domain invariant or business rule failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Collection:
      description: Paginated collection response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CollectionEnvelope"
    Conflict:
      description: State conflict or optimistic concurrency failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Created:
      description: Resource created.
      headers:
        Location:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SingleResourceEnvelope"
    DocumentVersion:
      description: DocumentVersion response.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "#/components/schemas/DocumentVersion"
              meta:
                $ref: "#/components/schemas/ResponseMeta"
    DocumentVersionCollection:
      description: Paginated DocumentVersion collection.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/CollectionEnvelope"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocumentVersion"
    Forbidden:
      description: Authenticated but categorically barred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist or caller is not authorized to know it exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Project:
      description: Project response.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "#/components/schemas/Project"
              meta:
                $ref: "#/components/schemas/ResponseMeta"
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SignedUpload:
      description: Signed upload URL response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SignedUpload"
    SignedUrl:
      description: Signed download URL response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SignedUrl"
    Success:
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SingleResourceEnvelope"
    Unauthenticated:
      description: Missing, invalid, or expired JWT.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Schema-level request validation failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
